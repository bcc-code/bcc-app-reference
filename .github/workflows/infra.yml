name: Infrastructure
run-name: Infrastructure - ${{ inputs.environment }} - ${{ inputs.action }}

# Manual plan, apply or destroy of infra/ (infra/preview-shared/ for dev, which holds the PR previews). deploy.yml also applies Terraform before every rollout; this workflow is for
# changes that are not tied to a deploy. The two share one concurrency group per environment, so a Terraform run and a
# deploy never overlap (standards 03.8, 06.10). A running job is not cancelled, since a cancelled apply can leave the
# state locked (05.10). GitHub keeps only one pending run per group, so a manual run still waiting behind a deploy is
# replaced when a newer deploy queues; run it again after that deploy.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        default: sandbox
        options:
          - sandbox
          - dev
          - prod
      action:
        type: choice
        description: Action to perform against the Terraform code.
        default: apply
        options:
          - apply
          - plan
          - plan destroy
          - destroy

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    # @main, not a SHA (exception in standards 03.5 and 17.7): the platform's GCP workload identity trusts the job_workflow_ref
    # of bcc-platform-deploy at refs/heads/main, so a commit pin is refused (403 getOpenIdToken). Same as other BCC repos.
    uses: bcc-code/bcc-platform-deploy/.github/workflows/terraform.yml@main
    permissions:
      id-token: write # requesting the JWT
      contents: read # actions/checkout in the called workflow
    with:
      component-name: main
      environment: ${{ inputs.environment }}
      path: ${{ inputs.environment == 'dev' && './infra/preview-shared' || './infra' }}
      action: ${{ inputs.action }}
      # The BCC monitoring collector (ADR 0026), from the org-level values. deploy.yml passes the same: Terraform requires
      # both. Picked by name, so a missing _PROD value turns prod's export off instead of falling back to the dev collector
      # (as `prod && a || b` would). The preview-shared root (dev) has no such variables, so it gets none.
      #
      # alert_emails (infra/monitoring.tf) is a JSON list from the repository variable ALERT_EMAILS_SANDBOX or
      # ALERT_EMAILS_PROD, for example ["ops@example.org"]. Prod refuses an empty list; an unset variable passes nothing.
      terraform-vars: |-
        ${{ inputs.environment != 'dev' && format('otel_exporter_otlp_endpoint={0}', vars[format('OTEL_EXPORTER_OTLP_ENDPOINT_{0}', inputs.environment == 'prod' && 'PROD' || 'DEV')]) || '' }}
        ${{ inputs.environment != 'dev' && vars[format('ALERT_EMAILS_{0}', inputs.environment == 'prod' && 'PROD' || 'SANDBOX')] && format('alert_emails={0}', vars[format('ALERT_EMAILS_{0}', inputs.environment == 'prod' && 'PROD' || 'SANDBOX')]) || '' }}
    secrets:
      # By static name, not a computed one (zizmor: overprovisioned-secrets). At most one term is non-empty, so prod never
      # gets the dev key.
      terraform-vars: |-
        ${{ inputs.environment != 'dev' && format('otel_exporter_otlp_auth_key={0}{1}', inputs.environment == 'prod' && secrets.OTEL_EXPORTER_OTLP_AUTH_KEY_PROD || '', inputs.environment != 'prod' && secrets.OTEL_EXPORTER_OTLP_AUTH_KEY_DEV || '') || '' }}
