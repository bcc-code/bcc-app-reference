name: Dependabot guard

# Dependabot's npm ecosystem can create package-lock.json. This repository uses pnpm only (standard 17 rule 4).
on:
  pull_request:
    paths:
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - '**/package-lock.json'
      - .github/dependabot.yml

permissions:
  contents: read

jobs:
  enforce-pnpm-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block npm lock files and require the pnpm lock file
        shell: bash
        run: |
          set -euo pipefail
          npm_lockfiles="$(find . -name package-lock.json -not -path '*/node_modules/*')"
          if [ -n "$npm_lockfiles" ]; then
            echo "package-lock.json is not allowed. Use frontend/pnpm-lock.yaml only."
            echo "$npm_lockfiles"
            exit 1
          fi
          if [ ! -f frontend/pnpm-lock.yaml ]; then
            echo "frontend/pnpm-lock.yaml is required."
            exit 1
          fi
