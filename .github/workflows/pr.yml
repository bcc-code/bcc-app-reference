name: CI

# Pull requests run the jobs whose inputs changed. Pushes to main and manual runs run everything, and deploy.yml starts
# from a successful run on main (standard 06 rule 2). Path filtering happens in the `changes` job, not in the trigger,
# so the required `ci` check always reports (standard 05 rule 2).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true' # NuGet locked-mode restore and the pnpm supply-chain policy
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf 'backend=true\nfrontend=true\ninfra=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          # A change under .github/ can break any job, so it runs all of them (standard 05 rule 3).
          workflows=$(echo "$files" | grep -Eq '^\.github/' && echo true || echo false)
          has() { if [ "$workflows" = true ] || echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          echo "backend=$(has '^(api/|Directory\.|global\.json|BccCode\..*\.slnx|\.config/|\.editorconfig)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has '^(frontend/|api/openapi/)')" >> "$GITHUB_OUTPUT"
          echo "infra=$(has '^infra/')" >> "$GITHUB_OUTPUT"

  # Both persistence variants (Marten and EF Core) are built and tested while the template has both; after
  # scripts/init-app.ps1 only the chosen one remains in the solution.
  # Debug on purpose: Release has no Roslyn for Wolverine's dynamic code generation, so the API tests need Debug. Release is
  # built, with pre-generated code, by deploy.yml. Debug builds of an API project also write api/openapi/openapi.json.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: dotnet format BccCode.Template.slnx --verify-no-changes
      - run: dotnet build BccCode.Template.slnx
      # --long-running names a test that runs past 120 s, so a hang shows which test it is (standard 05 rule 7).
      - run: dotnet test --solution BccCode.Template.slnx --no-build --long-running 120
      # Each variant writes the OpenAPI document when it is built, so a stale or variant-specific contract shows up as a diff
      # against the committed file. One variant at a time, because they write the same file. No Wolverine code generation is
      # needed for Debug builds: they compile handlers at runtime.
      - name: The OpenAPI contract is current for every variant
        run: |
          for project in api/BccCode.Template.Api*/; do   # every persistence variant; one project after init-app.ps1
            dotnet build "$project" --no-incremental
            git diff --exit-code api/openapi/openapi.json
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: |
            **/TestResults/
          if-no-files-found: ignore

  contracts:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          frontend: 'true'
      # The committed api/openapi/openapi.json is checked by the API tests. Here the client generated from it must match
      # what is committed.
      - run: pnpm --dir frontend run generate:api
      - name: The generated client is current
        run: |
          if [ -n "$(git status --porcelain -- frontend)" ]; then
            git status --porcelain -- frontend
            echo "::error::Run 'pnpm --dir frontend run generate:api' and commit the result"
            exit 1
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          frontend: 'true'
      # Every check runs in check mode and fails on a finding (standard 05 rule 6).
      - run: pnpm --dir frontend run lint
      - run: pnpm --dir frontend run format:check
      - run: pnpm --dir frontend run type-check
      - run: pnpm --dir frontend run test
      - run: pnpm --dir frontend run knip
      - run: pnpm --dir frontend run build

  # The user flows in a browser against the whole app, with axe in every flow (standard 19). The AppHost's E2E topology
  # serves the built frontend from the API (no Vite, no database UI) and uses random ports. Every persistence variant runs;
  # init-app.ps1 keeps only the chosen one.
  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        persistence:
          # template:only-marten:begin
          - marten
          # template:only-marten:end
          # template:only-efcore:begin
          - efcore
          # template:only-efcore:end
    env:
      E2E: 'true'
      # template:remove-on-init:begin
      Template__Persistence: ${{ matrix.persistence }}
      # template:remove-on-init:end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          frontend: 'true'
      # Kestrel needs a development certificate for the API's https endpoint (the __Host- cookie requires https). It is
      # not trusted on the runner; the browser ignores that (ignoreHTTPSErrors in playwright.config.ts).
      - run: dotnet dev-certs https
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend run build
      - run: aspire start --isolated --apphost api/AppHost/AppHost.csproj
      - run: aspire wait api --apphost api/AppHost/AppHost.csproj --timeout 300
      - name: Run the E2E tests
        run: |
          # The API's https endpoint (the session cookie is __Host-, so https only), not the dashboard's.
          url=$(aspire describe api --apphost api/AppHost/AppHost.csproj --format Json | node -e '
            const { resources } = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const api = resources.find((r) => r.displayName === "api")
            console.log(api?.urls.find((u) => u.name === "https")?.url ?? "")')
          if [ -z "$url" ]; then echo "::error::No https URL for the API in aspire describe"; exit 1; fi
          E2E_BASE_URL="$url" pnpm --dir frontend run e2e
      - if: failure()
        run: |
          for resource in schema seed api oidc; do aspire logs "$resource" --apphost api/AppHost/AppHost.csproj || true; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.persistence }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - if: always()
        run: aspire stop --apphost api/AppHost/AppHost.csproj || true

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/preview init -backend=false
      - run: terraform -chdir=infra/preview validate

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The CLI in a container, pinned by digest: gitleaks-action needs a paid licence for organisation repositories.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --log-opts="$BASE_SHA..HEAD"

  # The one required check. A job skipped by its `if:` counts as passed; a failed or cancelled one does not.
  ci:
    if: always()
    needs: [changes, backend, contracts, frontend, e2e, infra, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A required job failed or was cancelled"; exit 1 ;;
          esac
