# A preview of each PR with the `preview` label, in the landing zone's `dev` environment, one Postgres schema per PR
# (ADR 0027, standard 07).
name: PR preview

# Quoted: an unquoted " #" starts a YAML comment.
run-name: "Preview - PR #${{ github.event.pull_request.number || inputs.pr_number }} - ${{ github.event.action || 'manual destroy' }}"

on:
  # Deploys. A conflicted PR has no merge commit, so these events do not run for it.
  pull_request:
    types: [labeled, synchronize, reopened]
  # Teardowns, from the base branch so they run for conflicted PRs too. Secrets reach fork PRs here: this path must never
  # check out or run PR code.
  pull_request_target:
    types: [unlabeled, closed]
  # Manual destroy of an orphaned preview.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the PR whose preview to destroy
        required: true
        type: string

permissions:
  contents: read

# One run per PR, never cancelled: a cancelled apply leaves the Terraform state locked.
concurrency:
  group: preview-pr${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  # Every other job keys off its outputs (standard 07.2). The logic and its tests are in .github/scripts.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the sticky comment
    outputs:
      deploy: ${{ steps.d.outputs.deploy }}
      destroy: ${{ steps.d.outputs.destroy }}
      first_time: ${{ steps.d.outputs.first_time }}
      component: ${{ steps.d.outputs.component }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      # On pull_request_target the default ref is the base branch, so the script is never the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          STATE: ${{ github.event.pull_request.state }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTIVE=false
          # Only read when it can lead to a destroy (see preview-decide.sh).
          if [ "$EVENT" != workflow_dispatch ] && [ "$SAME_REPO" = true ] && { [ "$LABELLED" != true ] || [ "$STATE" = closed ]; }; then
            # Not piped into grep -q: SIGPIPE with pipefail.
            comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
            if grep -qF '<!-- template-preview:active -->' <<<"$comments"; then ACTIVE=true; fi
          fi
          export ACTIVE
          decision=$(bash .github/scripts/preview-decide.sh)
          echo "$decision" >> "$GITHUB_OUTPUT"
          {
            echo "event=$EVENT action=${ACTION:-none} label=${LABEL:-none} active=$ACTIVE"
            echo
            echo "$decision"
          } >> "$GITHUB_STEP_SUMMARY"

  # Untrusted PR code: read-only, no secrets (build-images.yml).
  build:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      tag: ${{ needs.decide.outputs.tag }}

  # Terraform needs the images to exist before it creates the revisions. Assets are not uploaded: a preview serves them
  # from the image.
  push:
    needs: [decide, build]
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The landing zone's dev environment holds PROPS, GCP_PROJECT_ID and sa-gha-cicd's WIF binding, as for terraform.yml.
    # No GitHub deployment here: the deployment job records one per PR in `preview`.
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    outputs:
      api_image: ${{ steps.push.outputs.api }}
      oidcmock_image: ${{ steps.push.outputs.oidcmock }}
    env:
      # The location Terraform uses (props.gcp.location), so the registry and the URLs agree with infra/preview.
      REGION: ${{ fromJSON(vars.PROPS).gcp.location }}
      # ar-bcc-template-<app_environment>, as infra/preview-shared names it.
      REPOSITORY: ${{ fromJSON(vars.PROPS).gcp.location }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ar-bcc-template-${{ fromJSON(vars.PROPS).app_environment }}
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIDPP_ID_DEV }}
          service_account: sa-gha-cicd@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api
          path: ${{ runner.temp }}/images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oidcmock
          path: ${{ runner.temp }}/images
      - name: Load, tag and push the images
        id: push
        env:
          IMAGES: ${{ runner.temp }}/images
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          for name in api oidcmock; do
            docker load -i "$IMAGES/$name.tar"
            docker tag "bcc-template-$name:$TAG" "$REPOSITORY/$name:$TAG"
            docker push "$REPOSITORY/$name:$TAG"
            # The registry digest from the push itself, as in deploy.yml.
            digest=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$REPOSITORY/$name:$TAG" \
              | grep "^$REPOSITORY/$name@" | cut -d@ -f2)
            test -n "$digest"
            echo "$name=$REPOSITORY/$name@$digest" >> "$GITHUB_OUTPUT"
          done

  # The API's account, its database group membership and its key grant, applied alone while the images build. A new
  # membership takes minutes to reach Cloud SQL, and the API stops on startup when it cannot connect. Later runs change
  # nothing here. The images are not known yet and the targeted resources do not use them.
  access:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    # @main, not a SHA: see provision.
    uses: bcc-code/bcc-platform-deploy/.github/workflows/terraform.yml@main
    permissions:
      id-token: write # requesting the JWT
      contents: read # actions/checkout in the called workflow
    with:
      component-name: ${{ needs.decide.outputs.component }}
      environment: dev
      path: ./infra/preview
      action: apply
      deployment-targets: google_cloud_identity_group_membership.api,google_kms_crypto_key_iam_member.api_data_protection
      terraform-vars: |-
        pr_number=${{ github.event.pull_request.number }}
        api_image=unused
        oidcmock_image=unused

  # After the data: the API checks its tables on startup, so its first revision fails without the schema. After access,
  # so the API's database access has had the build's minutes to take effect.
  provision:
    needs: [decide, push, data, access]
    if: needs.decide.outputs.deploy == 'true'
    # @main, not a SHA (exception in standards 03.5 and 17.7): the platform's GCP workload identity trusts the job_workflow_ref
    # of bcc-platform-deploy at refs/heads/main, so a commit pin is refused (403 getOpenIdToken). Same as infra.yml.
    uses: bcc-code/bcc-platform-deploy/.github/workflows/terraform.yml@main
    permissions:
      id-token: write # requesting the JWT
      contents: read # actions/checkout in the called workflow
    with:
      component-name: ${{ needs.decide.outputs.component }}
      environment: dev
      path: ./infra/preview
      action: apply
      terraform-vars: |-
        pr_number=${{ github.event.pull_request.number }}
        api_image=${{ needs.push.outputs.api_image }}
        oidcmock_image=${{ needs.push.outputs.oidcmock_image }}

  # The schema before every apply, as deploy.yml does before its rollout; reset and seed only on first deploy and reopen,
  # or when the schema is missing (standard 07.7). The images run on the runner through the Cloud SQL Auth Proxy. It
  # needs only the shared part (infra/preview-shared), not this PR's Terraform.
  data:
    needs: [decide, push]
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The landing zone's dev environment holds PROPS, GCP_PROJECT_ID and sa-gha-cicd's WIF binding, as for terraform.yml.
    # No GitHub deployment here: the deployment job records one per PR in `preview`.
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    outputs:
      api_url: ${{ steps.url.outputs.api_url }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      # The location Terraform uses (props.gcp.location); the app URL is built from it.
      REGION: ${{ fromJSON(vars.PROPS).gcp.location }}
      TAG: ${{ needs.decide.outputs.tag }}
      COMPONENT: ${{ needs.decide.outputs.component }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIDPP_ID_DEV }}
          service_account: sa-gha-cicd@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api
          path: ${{ runner.temp }}/images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testdata
          path: ${{ runner.temp }}/images
      - name: Apply the schema and seed
        env:
          IMAGES: ${{ runner.temp }}/images
          FIRST_TIME: ${{ needs.decide.outputs.first_time }}
          DB_NAME: ${{ fromJSON(vars.PROPS).shared_db.db_name }}
          DB_CONNECTION_NAME: ${{ fromJSON(vars.PROPS).shared_db.connection_name }}
          # The owner role of the database has the database's name, created by the landing zone.
          DB_OWNER_ROLE: ${{ fromJSON(vars.PROPS).shared_db.db_name }}
          # Same version and hash as deploy.yml.
          PROXY_VERSION: v2.26.2
          PROXY_SHA256: 787d23b4b396186f307b6b274c94099d25b15a81b7e60c91ceed18c07558e9d7
        run: |
          set -euo pipefail
          docker load -i "$IMAGES/api.tar"
          docker load -i "$IMAGES/testdata.tar"
          # The schema is pr<N> (infra/preview, output `schema`).
          schema="$COMPONENT"
          db_user="sa-gha-cicd@$PROJECT.iam"
          connection="Host=127.0.0.1;Port=5432;Database=$DB_NAME;Username=$db_user"
          curl -sSfLo cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$PROXY_VERSION/cloud-sql-proxy.linux.amd64"
          echo "$PROXY_SHA256  cloud-sql-proxy" | sha256sum --check --strict
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --auto-iam-authn --address 127.0.0.1 --port 5432 "$DB_CONNECTION_NAME" &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 5432; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::The Cloud SQL Auth Proxy did not start listening on 5432."; exit 1
          fi
          sql() {
            psql -w -v ON_ERROR_STOP=1 -c "$1" "host=127.0.0.1 port=5432 dbname=$DB_NAME user=$db_user"
          }
          jasper() {
            docker run --rm --network host \
              -e Gcp__ProjectId="$PROJECT" \
              -e Persistence__Schema="$schema" \
              -e ConnectionStrings__template="$connection" \
              "bcc-template-api:$TAG" jasper "$@"
          }
          # Cloud SQL can take minutes to see the CI account's group membership after the first apply.
          for attempt in 1 2 3 4 5 6; do
            if sql "SELECT 1" >/dev/null; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          reset="$FIRST_TIME"
          # A push can replace a queued first deploy in the concurrency group; the schema is then missing.
          exists=$(psql -w -tA -v ON_ERROR_STOP=1 -c "SELECT 1 FROM pg_namespace WHERE nspname = '$schema'" \
            "host=127.0.0.1 port=5432 dbname=$DB_NAME user=$db_user")
          if [ -z "$exists" ]; then reset=true; fi
          if [ "$reset" = true ]; then
            sql "DROP SCHEMA IF EXISTS \"$schema\" CASCADE"
            sql "CREATE SCHEMA \"$schema\""
          fi
          jasper db-apply
          sql "REASSIGN OWNED BY CURRENT_USER TO \"$DB_OWNER_ROLE\""
          jasper db-assert
          if [ "$reset" = true ]; then
            # Once mode starts Kestrel briefly; a random loopback port cannot clash with the proxy on the host network.
            docker run --rm --network host \
              -e ASPNETCORE_ENVIRONMENT=preview \
              -e ASPNETCORE_URLS=http://127.0.0.1:0 \
              -e Seeder__Once=true \
              -e Gcp__ProjectId="$PROJECT" \
              -e Persistence__Schema="$schema" \
              -e ConnectionStrings__template="$connection" \
              "bcc-template-testdata:$TAG"
          fi
      # Same form as api_url in infra/preview/main.tf.
      - name: Resolve the app URL
        id: url
        run: |
          set -euo pipefail
          number=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          echo "api_url=https://bcc-template-api-$COMPONENT-$number.$REGION.run.app" >> "$GITHUB_OUTPUT"

  # After the apply, so the posted URL is ready to use.
  comment:
    needs: [decide, data, provision]
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the sticky comment
    steps:
      - name: Upsert the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          API_URL: ${{ needs.data.outputs.api_url }}
          MARKER: "<!-- template-preview -->"
        run: |
          set -euo pipefail
          # Unquoted heredoc: every backtick is escaped.
          body=$(cat <<EOF
          ${MARKER}
          <!-- template-preview:active -->
          ### Preview

          | | |
          |---|---|
          | **App** | ${API_URL} |
          | **Commit** | \`${SHA}\` |

          Sign in with any persona on the mock's login page.

          The preview scales to zero, so the first request after an idle spell is slow while it starts. The durability pass runs every 30 minutes, so scheduled messages and retries can wait that long.

          There is no BCC PubSub: integration events are not sent.

          Remove and add the \`preview\` label to reset the data. Remove the label or close the PR to destroy the preview.
          EOF
          )
          # --jq runs per page; tail -n1 keeps one id.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\")))] | last | .id // empty" | tail -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

  # All previews share the GitHub environment `preview`, keyed by task (standard 07.12): Actions cannot delete
  # environments, so per-PR ones would pile up. Not `dev`, so the records and their cleanup stay apart from the
  # deployments terraform.yml makes there.
  deployment:
    needs: [decide, data, comment]
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Create the deployment and mark it successful
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.decide.outputs.component }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.data.outputs.api_url }}
        run: |
          set -euo pipefail
          task="preview-$COMPONENT"
          # Retire earlier deployments; auto_inactive skips transient ones.
          for dep in $(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=preview&task=$task" --jq '.[].id'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$dep/statuses" -f state=inactive >/dev/null
          done
          # jq and --input: gh -F cannot send an empty array. required_contexts: [] skips waiting on checks;
          # auto_merge: false avoids a 409.
          id=$(jq -n --arg ref "$SHA" --arg task "$task" --arg desc "Preview for $COMPONENT" \
              '{ref: $ref, environment: "preview", task: $task, description: $desc,
                transient_environment: true, auto_merge: false, required_contexts: []}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          jq -n --arg url "$URL" '{state: "success", environment_url: $url, auto_inactive: true}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input - >/dev/null

  # Drops the schema before the workspace goes. No checkout: nothing from the PR runs here.
  teardown-schema:
    needs: decide
    if: needs.decide.outputs.destroy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The landing zone's dev environment holds PROPS, GCP_PROJECT_ID and sa-gha-cicd's WIF binding, as for terraform.yml.
    # No GitHub deployment here: the deployment job records one per PR in `preview`.
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIDPP_ID_DEV }}
          service_account: sa-gha-cicd@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Drop the schema
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          COMPONENT: ${{ needs.decide.outputs.component }}
          DB_NAME: ${{ fromJSON(vars.PROPS).shared_db.db_name }}
          DB_CONNECTION_NAME: ${{ fromJSON(vars.PROPS).shared_db.connection_name }}
          # Same version and hash as deploy.yml.
          PROXY_VERSION: v2.26.2
          PROXY_SHA256: 787d23b4b396186f307b6b274c94099d25b15a81b7e60c91ceed18c07558e9d7
        run: |
          set -euo pipefail
          db_user="sa-gha-cicd@$PROJECT.iam"
          curl -sSfLo cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$PROXY_VERSION/cloud-sql-proxy.linux.amd64"
          echo "$PROXY_SHA256  cloud-sql-proxy" | sha256sum --check --strict
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --auto-iam-authn --address 127.0.0.1 --port 5432 "$DB_CONNECTION_NAME" &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 5432; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::The Cloud SQL Auth Proxy did not start listening on 5432."; exit 1
          fi
          psql -w -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS \"$COMPONENT\" CASCADE" \
            "host=127.0.0.1 port=5432 dbname=$DB_NAME user=$db_user"

  # The called workflow checks out the run's ref: the base branch on pull_request_target and workflow_dispatch, the PR's
  # merge commit when a pull_request event destroys (a same-repo PR only, whose Terraform the deploys already applied).
  teardown:
    needs: [decide, teardown-schema]
    if: needs.decide.outputs.destroy == 'true'
    uses: bcc-code/bcc-platform-deploy/.github/workflows/terraform.yml@main
    permissions:
      id-token: write # requesting the JWT
      contents: read # actions/checkout in the called workflow
    with:
      component-name: ${{ needs.decide.outputs.component }}
      environment: dev
      path: ./infra/preview
      action: destroy
      # Required to load the configuration; the image values do not matter for a destroy.
      terraform-vars: |-
        pr_number=${{ github.event.pull_request.number || inputs.pr_number }}
        api_image=unused
        oidcmock_image=unused

  teardown-comment:
    needs: [decide, teardown]
    if: always() && needs.decide.outputs.destroy == 'true' && needs.teardown.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the sticky comment
      deployments: write
    steps:
      - name: Mark the sticky comment destroyed and remove the deployments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          COMPONENT: ${{ needs.decide.outputs.component }}
          MARKER: "<!-- template-preview -->"
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\")))] | last | .id // empty" | tail -n1)
          if [ -n "$id" ]; then
            body=$(cat <<EOF
          ${MARKER}
          ### Preview destroyed

          Add the \`preview\` label again to create a fresh one.
          EOF
          )
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          fi
          # Deactivate, then delete (DELETE requires inactive).
          for dep in $(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=preview&task=preview-$COMPONENT" --jq '.[].id'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$dep/statuses" -f state=inactive >/dev/null
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$dep" >/dev/null
          done
