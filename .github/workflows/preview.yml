# A preview environment per pull request that carries the "preview" label (standard 07). See docs/pr-previews.md.
#
# STARTING POINT. It works end to end for the API service only. Search for TODO: the database, the migration job, the
# OIDC mock and ingress restriction are still to be added in infra/preview/ before a preview is usable.
name: PR preview

# Quoted: an unquoted " #" starts a YAML comment.
run-name: "Preview - PR #${{ github.event.pull_request.number || inputs.pr_number }} - ${{ github.event.action || 'manual destroy' }}"

on:
  # Deploys. A conflicted PR has no merge commit, so these events do not run for it.
  pull_request:
    types: [labeled, synchronize, reopened]
  # Teardowns, from the base branch so they run for conflicted PRs too. Secrets reach fork PRs here, so this path must
  # never check out or run PR code (standard 07 rule 14).
  pull_request_target:
    types: [unlabeled, closed]
  # Manual destroy of an orphaned preview.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the PR whose preview environment to destroy
        required: true
        type: string

permissions:
  contents: read

# One run per PR, never cancelled: cancelling in the middle of an apply leaves the Terraform state locked.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  CI: 'true'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The API project that is built into the image; scripts/init-app.ps1 rewrites it (template:init-note)
  API_PROJECT: api/BccCode.Template.Api.Marten

jobs:
  # Decides what the event does; every other job keys off its outputs.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.d.outputs.deploy }}
      destroy: ${{ steps.d.outputs.destroy }}
      component: ${{ steps.d.outputs.component }}
      tag: ${{ steps.d.outputs.tag }}
      first_time: ${{ steps.d.outputs.first_time }}
      pr: ${{ steps.d.outputs.pr }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          # The label that changed (labeled/unlabeled only).
          LABEL: ${{ github.event.label.name }}
          # Whether the PR has the label now.
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          deploy=false
          destroy=false
          first_time=false

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            # A typo would target a fresh empty Terraform workspace instead of the preview (standard 07 rule 15).
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "pr_number must be a plain PR number, got '$PR'" >&2
              exit 1
            fi
            destroy=true
          # Forks get no OIDC token, so they can neither deploy nor destroy (standard 07 rule 4).
          elif [[ "$SAME_REPO" == "true" ]]; then
            case "$ACTION" in
              labeled)
                # Any other label must not reseed: that drops the preview's database (standard 07 rule 3).
                if [[ "$LABEL" == "preview" ]]; then
                  deploy=true
                  first_time=true      # brand-new database
                fi
                ;;
              unlabeled)
                if [[ "$LABEL" == "preview" ]]; then
                  destroy=true
                fi
                ;;
              reopened)
                # Closing destroyed the database, so reseed.
                if [[ "$LABELLED" == "true" ]]; then
                  deploy=true
                  first_time=true
                fi
                ;;
              synchronize)
                if [[ "$LABELLED" == "true" ]]; then
                  deploy=true          # new image, existing database: no reseed
                else
                  # A queued teardown can be displaced by this push. Destroy if the sticky comment still says the
                  # preview is active. Not piped into grep -q: SIGPIPE with pipefail.
                  comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate --jq '.[].body' || true)
                  if grep -qF '<!-- template-preview:active -->' <<<"$comments"; then
                    destroy=true
                  fi
                fi
                ;;
              closed)
                if [[ "$LABELLED" == "true" ]]; then
                  destroy=true
                fi
                ;;
            esac
          fi

          # pull_request_target has secrets even for forks; it must never deploy PR code.
          if [[ "$EVENT" == "pull_request_target" && "$deploy" == "true" ]]; then
            echo "refusing to deploy from a pull_request_target run" >&2
            exit 1
          fi

          {
            echo "deploy=$deploy"
            echo "destroy=$destroy"
            echo "first_time=$first_time"
            echo "component=pr${PR}"
            echo "tag=pr${PR}-${SHA}"
            echo "pr=${PR}"
          } >> "$GITHUB_OUTPUT"

          echo "event=$EVENT action=${ACTION:-none} label=${LABEL:-none} -> deploy=$deploy destroy=$destroy first_time=$first_time component=pr${PR}" >> "$GITHUB_STEP_SUMMARY"

  # Terraform needs the image to exist before it creates the revision.
  build:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A separate GitHub environment without a branch restriction: previews run PR code (standard 07 rule 21).
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.decide.outputs.tag }}
      REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      REPOSITORY_PATH: ${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}
    outputs:
      api_image: ${{ steps.push.outputs.api_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          frontend: 'true'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: pnpm --dir frontend run build
      # TODO: the hashed assets of a preview are not uploaded to the bucket, so the preview serves them from the image only
      # if the API does so. Decide whether previews use the bucket or a copy inside the image.
      - name: Bake index.html into the image
        run: mkdir -p "$API_PROJECT/wwwroot" && cp -r frontend/dist/. "$API_PROJECT/wwwroot/"
      - id: push
        name: Publish the container image
        run: |
          set -euo pipefail
          export SDK_CONTAINER_REGISTRY_UNAME=oauth2accesstoken
          export SDK_CONTAINER_REGISTRY_PWORD="$(gcloud auth print-access-token)"
          dotnet publish "$API_PROJECT" --configuration Release --runtime linux-x64 --self-contained false \
            /t:PublishContainer \
            -p:ContainerRegistry="$REGISTRY_HOST" \
            -p:ContainerRepository="$REPOSITORY_PATH/template-api" \
            -p:ContainerImageTags="\"$TAG\""
          echo "api_image=$REGISTRY_HOST/$REPOSITORY_PATH/template-api:$TAG" >> "$GITHUB_OUTPUT"

  provision:
    needs: [decide, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      COMPONENT: ${{ needs.decide.outputs.component }}
      PR: ${{ needs.decide.outputs.pr }}
      API_IMAGE: ${{ needs.build.outputs.api_image }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT }}
      - name: Apply into workspace pr<N>
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          cd infra/preview
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=template/preview"
          terraform workspace select -or-create "$COMPONENT"
          terraform apply -input=false -auto-approve -no-color \
            -var "project_id=$PROJECT_ID" -var "region=$REGION" -var "pr_number=$PR" -var "api_image=$API_IMAGE"

  # Runs after every apply: nothing else migrates a preview's database. Only the first run resets and seeds it.
  # TODO: needs the migration job and database in infra/preview/. Set the repository variable PREVIEW_HAS_DATABASE to
  # 'true' once they exist.
  migrate:
    needs: [decide, provision]
    if: needs.decide.outputs.deploy == 'true' && vars.PREVIEW_HAS_DATABASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Execute the migration job
        env:
          JOB: template-migrate-${{ needs.decide.outputs.component }}
          FIRST_TIME: ${{ needs.decide.outputs.first_time }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          # TODO: seeding. On the first run (FIRST_TIME=true) the job should also reset and seed the database, with an
          # override such as --container app --update-env-vars SEEDER__RESETFIRST=true. The seeder and its allowlist
          # (standard 02, which includes "preview") do not exist in the template yet, so both runs are plain migrations.
          echo "first_time=$FIRST_TIME"
          gcloud run jobs execute "$JOB" --region "$REGION" --wait

  # After provision (and migrate when it runs), so the posted URL is ready to use.
  comment:
    needs: [decide, provision, migrate]
    if: always() && needs.decide.outputs.deploy == 'true' && needs.provision.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      api_url: ${{ steps.urls.outputs.api }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Resolve the URL
        id: urls
        env:
          COMPONENT: ${{ needs.decide.outputs.component }}
          REGION: ${{ vars.GCP_REGION }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Deterministic (standard 07 rule 10). Must match the service name in infra/preview/main.tf.
          num=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          echo "api=https://template-api-${COMPONENT}-${num}.${REGION}.run.app" >> "$GITHUB_OUTPUT"
      - name: Upsert the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          MARKER: "<!-- template-preview -->"
          API: ${{ steps.urls.outputs.api }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Unquoted heredoc: escape every backtick.
          body=$(cat <<EOF
          ${MARKER}
          <!-- template-preview:active -->
          ### Preview environment

          | | |
          |---|---|
          | **App** | ${API} |
          | **Commit** | \`${SHA}\` |

          Log in through the preview's own mock identity provider. Any test persona works. The preview holds generated test
          data only and must never receive production or personal data.

          The environment scales to zero, so the first request after an idle spell is slow, and background jobs do not run
          while it is idle.

          Remove the \`preview\` label or close the PR to destroy it.
          EOF
          )
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | last | .id // empty" | tail -n1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi

  # All previews share the "preview" environment, keyed by task: Actions cannot delete environments, so one per PR would
  # pile up in Settings (standard 07 rule 12).
  deployment:
    needs: [decide, comment]
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Create the deployment and mark it successful
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.decide.outputs.component }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.comment.outputs.api_url }}
        run: |
          set -euo pipefail
          task="preview-${COMPONENT}"
          # Retire earlier deployments of this PR.
          for dep in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=preview&task=${task}" --jq '.[].id'); do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${dep}/statuses" -f state=inactive >/dev/null
          done
          # jq and --input: gh -F cannot send an empty array. required_contexts: [] skips waiting on checks.
          id=$(jq -n --arg ref "$SHA" --arg task "$task" --arg desc "Preview for ${COMPONENT}" \
                 '{ref: $ref, environment: "preview", task: $task, description: $desc,
                   transient_environment: true, auto_merge: false, required_contexts: []}' \
               | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id')
          jq -n --arg url "$URL" '{state: "success", environment_url: $url, auto_inactive: true}' \
            | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --input - >/dev/null

  teardown:
    needs: decide
    if: needs.decide.outputs.destroy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      COMPONENT: ${{ needs.decide.outputs.component }}
      PR: ${{ needs.decide.outputs.pr }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      # The default branch, never the PR: this job also runs from pull_request_target (standard 07 rule 14).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_SERVICE_ACCOUNT }}
      - name: Destroy workspace pr<N>
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          cd infra/preview
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=template/preview"
          terraform workspace select "$COMPONENT"
          # The image does not matter for a destroy; the variable is required to load the configuration.
          terraform destroy -input=false -auto-approve -no-color \
            -var "project_id=$PROJECT_ID" -var "region=$REGION" -var "pr_number=$PR" -var "api_image=unused"
          terraform workspace select default
          terraform workspace delete "$COMPONENT"

  teardown-comment:
    needs: [decide, teardown]
    if: always() && needs.decide.outputs.destroy == 'true' && needs.teardown.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job permissions replace the workflow's, so every one needed is restated.
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Mark the sticky comment torn down and delete the deployments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          MARKER: "<!-- template-preview -->"
          COMPONENT: ${{ needs.decide.outputs.component }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | last | .id // empty" | tail -n1)
          if [[ -n "$id" ]]; then
            body=$(cat <<EOF
          ${MARKER}
          ### Preview environment destroyed

          Add the \`preview\` label again to create a fresh one.
          EOF
          )
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          fi
          # Deactivate, then delete (DELETE requires inactive).
          for dep in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=preview&task=preview-${COMPONENT}" --jq '.[].id'); do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${dep}/statuses" -f state=inactive >/dev/null
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/${dep}" >/dev/null
          done
