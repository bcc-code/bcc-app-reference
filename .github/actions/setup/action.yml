name: Setup toolchain
description: .NET from global.json and dotnet tools; optionally pnpm, Node 24 and frontend dependencies.
inputs:
  frontend:
    description: Install pnpm, Node and the frontend dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
    - shell: bash
      run: dotnet tool restore || dotnet tool restore # dotnet/sdk#53783: the first restore can fail on a cold cache
    - if: inputs.frontend == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        # Keep in sync with devEngines.packageManager in frontend/package.json. With another version, pnpm downloads the
        # pinned one (onFail: download).
        # Dependabot does not update either one.
        version: 12.17.0
    - if: inputs.frontend == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - if: inputs.frontend == 'true'
      shell: bash
      run: pnpm --dir frontend install --frozen-lockfile
