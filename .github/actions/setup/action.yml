name: Setup toolchain
description: .NET from global.json and dotnet tools; optionally pnpm, Node and the frontend dependencies.
inputs:
  frontend:
    description: Install pnpm, Node and the frontend dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - shell: bash
      run: dotnet tool restore || dotnet tool restore # dotnet/sdk#53783: the first restore can fail on a cold cache
    - if: inputs.frontend == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.11.2 # keep in sync with frontend/package.json devEngines
    - if: inputs.frontend == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26 # keep in sync with frontend/package.json devEngines
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - if: inputs.frontend == 'true'
      shell: bash
      env:
        CI: 'true' # pnpm supply-chain policy
      run: pnpm --dir frontend install --frozen-lockfile
