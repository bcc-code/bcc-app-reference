packages:
  - .
pmOnFail: error
engineStrict: true
# Supply-chain block (standard 17): a release must be 7 days old before it can be installed. The BCC packages are ours.
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@bcc-code/*'
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  vue-demi: true
